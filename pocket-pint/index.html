<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A cold virtual beer. Hold the tap to fill the glass, wipe the condensation, then tip your phone back to drink.">
<meta name="theme-color" content="#1C3A2F">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Pocket Pint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one screen. Tiled pub wall on top with the wordmark and tally, a cold glass
   stands on the bar under a brass tap, and the bar itself holds the readout and the
   two hold-buttons at thumb height. */
:root{
  --wall:#E4EEE3; --grout:#D2E0D4; --ink:#17352B; --muted:#4D685D;
  --bar:#1C3A2F; --bar-hi:#355F4D; --on-bar:#F6EED8; --on-bar-muted:#A9C2B4;
  --beer-top:#F8C847; --beer:#EFA51A; --beer-deep:#B25E08;
  --foam:#FFF5DC; --foam-light:#FFFCF3; --foam-shade:#E9D6A8;
  --brass:#C39A3A; --brass-hi:#F3DE98; --brass-lo:#80601A; --knob:#14261F;
  --glow:rgba(255,255,255,.7); --shadow:rgba(6,22,16,.5);
  --glass-line:rgba(23,53,43,.42); --glass-edge:rgba(52,96,80,.26); --glass-mid:rgba(255,255,255,.2);
  --shine:rgba(255,255,255,.9); --etch:rgba(23,53,43,.5);
  --btn:#EFAA1A; --btn-ink:#22220F; --btn-shadow:#9A5A06; --focus:#FFF7E0;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
  --text:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#11281F; --grout:#183529; --ink:#F3EAD2; --muted:#9CB6A8;
    --bar:#091812; --bar-hi:#1F3D30; --on-bar:#F3EAD2; --on-bar-muted:#8FA99B;
    --beer-top:#FFCE55; --beer:#F2AE28; --beer-deep:#A65708;
    --foam:#FFF3D4; --foam-light:#FFFBEC; --foam-shade:#DCC690;
    --brass:#CFA548; --brass-hi:#F5E2A0; --brass-lo:#75581A; --knob:#EDE3C8;
    --glow:rgba(242,176,42,.13); --shadow:rgba(0,0,0,.65);
    --glass-line:rgba(243,234,210,.38); --glass-edge:rgba(210,232,220,.17); --glass-mid:rgba(255,255,255,.03);
    --shine:rgba(255,255,255,.55); --etch:rgba(255,250,235,.62);
    --btn:#F2B02A; --btn-ink:#1B1A0A; --btn-shadow:#8A5206; --focus:#FFF4D6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#11281F; --grout:#183529; --ink:#F3EAD2; --muted:#9CB6A8;
  --bar:#091812; --bar-hi:#1F3D30; --on-bar:#F3EAD2; --on-bar-muted:#8FA99B;
  --beer-top:#FFCE55; --beer:#F2AE28; --beer-deep:#A65708;
  --foam:#FFF3D4; --foam-light:#FFFBEC; --foam-shade:#DCC690;
  --brass:#CFA548; --brass-hi:#F5E2A0; --brass-lo:#75581A; --knob:#EDE3C8;
  --glow:rgba(242,176,42,.13); --shadow:rgba(0,0,0,.65);
  --glass-line:rgba(243,234,210,.38); --glass-edge:rgba(210,232,220,.17); --glass-mid:rgba(255,255,255,.03);
  --shine:rgba(255,255,255,.55); --etch:rgba(255,250,235,.62);
  --btn:#F2B02A; --btn-ink:#1B1A0A; --btn-shadow:#8A5206; --focus:#FFF4D6;
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;background:var(--wall);color:var(--ink);
  font-family:var(--text);font-size:1rem;line-height:1.35;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
.pub{
  height:100%;min-height:27rem;display:grid;grid-template-rows:auto minmax(12rem,1fr) auto;
  background:
    linear-gradient(var(--grout) 2px,transparent 2px) 0 0/100% 3.5rem,
    linear-gradient(90deg,var(--grout) 2px,transparent 2px) 0 0/7rem 3.5rem,
    var(--wall);
}
.top{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  width:100%;max-width:35rem;margin-inline:auto;padding-block:.9rem .25rem;padding-inline:16px;
}
.mark{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;letter-spacing:.01em;text-wrap:balance}
.tally{margin:0;display:flex;align-items:baseline;gap:.5rem}
.tally-label{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tally-num{font-family:var(--display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}

.stage{position:relative;min-height:0;min-width:0}
#glass{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.deck{background:var(--bar);color:var(--on-bar)}
.deck-inner{
  width:100%;max-width:35rem;margin-inline:auto;padding-block:.35rem 1rem;padding-inline:16px;
  display:flex;flex-direction:column;gap:.8rem;
}
.read{display:flex;align-items:center;gap:1rem}
.vol{margin:0;flex:none;min-width:5.6rem;font-family:var(--display);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.unit{font-family:var(--text);font-weight:700;font-size:.95rem;letter-spacing:.06em;color:var(--on-bar-muted);margin-left:.3rem}
.status{margin:0;flex:1;min-width:0;min-height:2.7em;display:flex;align-items:center;font-weight:500;font-size:1.02rem;color:var(--on-bar-muted)}

.taps{display:flex;gap:.7rem;margin-bottom:.4rem}
.btn{
  appearance:none;border:0;flex:1 1 0;min-width:0;padding:1.05rem .6rem;border-radius:.85rem;
  font-family:var(--display);font-size:1.18rem;letter-spacing:.02em;line-height:1;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  transition:transform .09s cubic-bezier(.3,.7,.4,1),box-shadow .09s cubic-bezier(.3,.7,.4,1);
}
.btn.pour{background:var(--btn);color:var(--btn-ink);box-shadow:0 .4rem 0 var(--btn-shadow)}
.btn.sip{background:var(--bar-hi);color:var(--on-bar);box-shadow:0 .4rem 0 rgba(0,0,0,.45)}
.btn.down{transform:translateY(.28rem)}
.btn.pour.down{box-shadow:0 .12rem 0 var(--btn-shadow)}
.btn.sip.down{box-shadow:0 .12rem 0 rgba(0,0,0,.45)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="pub">
  <header class="top">
    <h1 class="mark">Pocket Pint</h1>
    <p class="tally"><span class="tally-label">Pints sunk</span><span class="tally-num" id="tally">0</span></p>
  </header>

  <div class="stage" id="stage">
    <canvas id="glass" role="img" aria-label="A cold beer glass, fogged with condensation, standing on the bar under a brass tap"></canvas>
  </div>

  <footer class="deck">
    <div class="deck-inner">
      <div class="read">
        <p class="vol"><span id="ml">0</span><span class="unit">ml</span></p>
        <p class="status" id="status" aria-live="polite">Hold the tap to fill the glass.</p>
      </div>
      <div class="taps">
        <button class="btn pour" id="pour" type="button">Hold to pour</button>
        <button class="btn sip" id="sip" type="button">Hold to drink</button>
      </div>
    </div>
  </footer>
</main>

    var b = beads[i], rp = b.r*u*z;
    if (rp < 2.6){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); continue; }
    var sy = b.run ? 1 + Math.min(0.7, b.v*0.55) : 1;
    ctx.drawImage(beadSprite, b.x - b.r*k, b.y - b.r*k*sy - (sy - 1)*b.r*0.4, b.r*k*2, b.r*k*2*sy);
  }

  // reflections, sliding a touch as the glass tilts
  var par = clamp(glassAngle + (sensor.on ? sensor.x*0.9 : 0), -0.7, 0.7)*(calm ? 0 : 0.07);
  function band(side, inset, width, y0, y1, alpha){
    var a = [], c2 = [], j;
    for (j = 0; j <= 22; j++){
      var tt = j/22, y = lerp(y0, y1, tt), hw = 0;
      for (var m = 1; m < INNER_HALF.length; m++){
        if (INNER_HALF[m][1] <= y){ var p0 = INNER_HALF[m-1], p1 = INNER_HALF[m]; hw = p0[0] + (p1[0] - p0[0])*((y - p0[1])/((p1[1] - p0[1]) || 1)); break; }
      }
      var w = width*Math.pow(Math.sin(Math.PI*clamp(tt, 0.02, 0.98)), 0.55), x0 = hw - inset + par*side;
      a.push([side*x0, y]); c2.push([side*(x0 - w), y]);
    }
    ctx.beginPath(); ctx.moveTo(a[0][0], a[0][1]);
    for (j = 1; j < a.length; j++) ctx.lineTo(a[j][0], a[j][1]);
    for (j = c2.length - 1; j >= 0; j--) ctx.lineTo(c2[j][0], c2[j][1]);
    ctx.closePath(); ctx.globalAlpha = alpha; ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = T.shine;
  band(-1, 0.085, 0.17, -1.3, 1.0, 0.1);
  band(-1, 0.105, 0.125, -1.27, 0.95, 0.13);
  band(-1, 0.125, 0.085, -1.23, 0.88, 0.17);
  band(-1, 0.142, 0.05, -1.18, 0.8, 0.24);
  band(-1, 0.155, 0.022, -1.1, 0.68, 0.34);
  band(-1, 0.34, 0.06, -1.0, 0.25, 0.07);
  band(-1, 0.355, 0.03, -0.95, 0.15, 0.1);
  band(1, 0.06, 0.06, -1.18, 0.6, 0.12);
  band(1, 0.072, 0.03, -1.12, 0.5, 0.26);
  band(1, 0.2, 0.1, -0.9, 0.9, 0.06);
  // near side of the rim, with a glint
  ctx.strokeStyle = T.glassLine; ctx.lineWidth = px*1.3;
  ctx.beginPath(); ctx.ellipse(0, -HH, 0.975, 0.975*e, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = T.shine; ctx.lineWidth = px*2; ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.ellipse(0, -HH, 0.955, 0.955*e, 0, Math.PI*0.62, Math.PI*0.84); ctx.stroke();
  ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.ellipse(0, -HH, 0.955, 0.955*e, 0, Math.PI*0.12, Math.PI*0.2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawSpill(){
  if (spillVis < 0.03 || Math.abs(liq) < 0.2) return;
  var side = liq > 0 ? 1 : -1, rx = side*0.95, ry = -HH, z = P.zoom;
  var sa = Math.sin(glassAngle), ca = Math.cos(glassAngle);
  var x0 = P.gxc + (rx*ca - ry*sa)*u*z, y0 = P.cy + (rx*sa + ry*ca)*u*z;
  var gvx = sensor.on ? sensor.x : 0, gvy = sensor.on ? sensor.y : 1;
  var speed = (1.1 + 2.2*spillVis)*u, vx = ca*side*speed, vy = sa*side*speed, n = 18, T1 = 0.3;
  var col = mix(T.beer, T.foam, clamp(spillFoam, 0, 1)*0.85), c = hexRGB(T.beer), cf = hexRGB(T.foam), f = clamp(spillFoam, 0, 1)*0.85;
  var rC = Math.round(lerp(c[0], cf[0], f)), gC = Math.round(lerp(c[1], cf[1], f)), bC = Math.round(lerp(c[2], cf[2], f));
  ctx.lineCap = 'round';
  var px = x0, py = y0;
  for (var i = 1; i <= n; i++){
    var t = T1*i/n, x = x0 + vx*t + 0.5*gvx*G*0.55*u*t*t, y = y0 + vy*t + 0.5*gvy*G*0.55*u*t*t;
    var w = u*(0.04 + 0.15*Math.min(1, spillVis))*(1 - 0.6*i/n), a = i/n < 0.35 ? 1 : Math.pow(1 - (i/n - 0.35)/0.65, 1.5);
    ctx.strokeStyle = 'rgba(' + rC + ',' + gC + ',' + bC + ',' + a.toFixed(3) + ')'; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.4*a).toFixed(3) + ')'; ctx.lineWidth = w*0.16;
    ctx.beginPath(); ctx.moveTo(px - w*0.22, py); ctx.lineTo(x - w*0.22, y); ctx.stroke();
    px = x; py = y;
  }
  void col;
}
function paint(now){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  var g, z = P.zoom, grounded = 1 - clamp(P.lift*1.6, 0, 0.85);

  // light on the wall behind the glass
  g = ctx.createRadialGradient(cx, baseY - 2.1*u, u*0.2, cx, baseY - 2.1*u, u*3.3);
  g.addColorStop(0, T.glow); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // the bar top, seen almost edge on
  g = ctx.createLinearGradient(0, barY, 0, H); g.addColorStop(0, T.barHi); g.addColorStop(0.5, T.bar); g.addColorStop(1, T.bar);
  ctx.fillStyle = g; ctx.fillRect(0, barY, W, H - barY + 1);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(0, barY, W, Math.max(1, u*0.018));
  // contact shadow, and the amber light a full glass throws on the wood
  ctx.save(); ctx.beginPath(); ctx.rect(0, barY, W, H - barY + 1); ctx.clip();
  ctx.translate(P.gxc, baseY + 0.02*u); ctx.scale(1, 0.14);
  g = ctx.createRadialGradient(0, 0, u*0.2, 0, 0, u*(1.15 + P.lift*0.8));
  g.addColorStop(0, T.shadow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = grounded; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, u*2.2, 0, TAU); ctx.fill();
  var lit = clamp(beer/380, 0, 1);
  if (lit > 0.02){
    g = ctx.createRadialGradient(u*0.42, u*0.5, 0, u*0.42, u*0.5, u*1.25);
    g.addColorStop(0, rgba(T.beerTop, 0.55*lit)); g.addColorStop(1, rgba(T.beerTop, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(u*0.42, u*0.5, u*1.25, 0, TAU); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;

  drawTap();
  drawStreams(now);
  drawGlass(now);
  drawSpill();
  void z;
}

/* =====================================================================
   Frame loop
   ===================================================================== */
function statusText(now, upright, total){
  if (pourHeld && !upright) return sensor.on ? 'Stand your phone up to pour.' : 'Let the glass stand before you pour.';
  if (pourHeld && total >= FULL_ML - 3) return 'Brim-full. The rest goes on the bar.';
  if (pourHeld) return 'Pouring…';
  if (spillVis > 0.1 || (drinkHeld && total > 1)) return 'Down it goes.';
  if (now - doneAt < 3500) return 'Empty. That was pint number ' + count + '.';
  if (total < 1) return 'Empty glass. Hold the tap to fill it.';
  if (!wipedOnce && fogAmt > 0.5 && now < hintUntil) return 'The glass is cold. Wipe it with your finger.';
  var how = sensor.on ? 'Tip your phone back to drink.' : 'Hold the drink button to sip.';
  return total >= LINE_ML - 5 ? 'Full to the line. ' + how : how;
}
function frame(now){
  var real = Math.min(0.1, Math.max(0, (now - lastT)/1000)); lastT = now;
  acc += real;
  var res = { upright:true, hit:0, out:0 }, steps = 0;

  // where the stream lands, from the last painted pose
  var surfY = (beer + foam > 2 && L.chT) ? L.cT/Math.max(0.5, L.gy) : HH;
  streamD = clamp((P.cy + surfY*u*P.zoom - spoutY)/u, 0.3, 5);

  while (acc >= DT && steps < 8){ res = step(DT, now); acc -= DT; steps++; }
  if (steps === 8) acc = 0;
  computeLevels();

  // pose of the glass on screen
  var sa = Math.sin(glassAngle), ca = Math.cos(glassAngle), low = -1e9;
  for (var i = 0; i < FOOT.length; i++){ var yy = FOOT[i][0]*sa + FOOT[i][1]*ca; if (yy > low) low = yy; }
  var raise = Math.sin(pitchTot);
  P.zoom = 1 + 0.04*raise;
  P.e = 0.065 + 0.26*Math.pow(raise, 1.2);
  P.lift = (low - 1.78) + 0.3*Math.min(1, Math.abs(glassAngle)*1.4);
  P.gxc = cx + sa*0.12*u;
  P.cy = baseY - 1.78*u*P.zoom - P.lift*u;

  if (fogSeed){ fogSeed = false; seedCold(); }

  // pour side effects that only need doing once a frame
  var gx = L.gx, gy = L.gy;
  if (res.hit > 0 && L.chT){
    while (bubAcc >= 1){
      bubAcc -= 1;
      var d0 = L.cB + 0.04 + Math.random()*0.1, sx = (Math.random() - 0.5)*0.14;
      addBubble(gx*d0 + gy*sx, gy*d0 - gx*sx, gx*(1.4 + Math.random()*2.2) + gy*(Math.random() - 0.5)*1.5, gy*(1.4 + Math.random()*2.2) - gx*(Math.random() - 0.5)*1.5, 0.005 + Math.random()*0.011);
    }
    while (splashAcc >= 1 && splash.length < 60){
      splashAcc -= 1;
      var up = 1.2 + Math.random()*2.6, sd = (Math.random() - 0.5)*2.4, c0 = L.cT - 0.02;
      splash.push({ x:gx*c0 + gy*(Math.random() - 0.5)*0.1, y:gy*c0 - gx*(Math.random() - 0.5)*0.1, vx:-gx*up + gy*sd, vy:-gy*up - gx*sd, r:0.012 + Math.random()*0.02, life:0, f:foam > 8 && Math.random() < 0.6 });
    }
  } else { bubAcc = Math.min(bubAcc, 1); splashAcc = Math.min(splashAcc, 1); }
  stepBubbles(real);

  // drips from the spout after the tap closes
  for (var k = drips.length - 1; k >= 0; k--){
    var d = drips[k];
    if (!d.fall){
      d.wait -= real;
      if (d.wait < 0.32) d.r = 0.05*clamp(1 - d.wait/0.32, 0, 1);
      if (d.wait <= 0){ d.fall = true; d.y = 0.05; d.vy = 0.4; }
    } else {
      d.vy += G*real; d.y += d.vy*real;
      if (d.y >= streamD){ if (res.upright){ beer += 0.4; waveKick(L.chT ? (0 - L.chT[0])/(L.chT[1] - L.chT[0]) : 0.5, -0.5, 1.2); } drips.splice(k, 1); }
    }
  }

  // lacing: foam left on the glass as the level falls
  if (foam > 6 && L.chT && L.laceAt != null && L.cT > L.laceAt + 0.02){
    var n = 12 + (Math.random()*8)|0, s0 = L.chT[0], s1 = L.chT[1];
    laceX.fillStyle = rgba(T.foam, 1);
    laceX.strokeStyle = rgba(T.foam, 0.1*clamp(foam/45, 0.2, 1)); laceX.lineWidth = Math.max(1, fs*0.009);
    laceX.beginPath(); laceX.moveTo(fX(gx*L.laceAt + gy*s0), fY(gy*L.laceAt - gx*s0)); laceX.lineTo(fX(gx*L.laceAt + gy*s1), fY(gy*L.laceAt - gx*s1)); laceX.stroke();
    for (var q = 0; q < n; q++){
      var h = Math.random(), xi = Math.random() < 0.5 ? h*h*0.5 : 1 - h*h*0.5, s = lerp(s0, s1, xi), dd = L.laceAt + (Math.random() - 0.5)*0.035;
      laceX.globalAlpha = clamp(foam/45, 0.2, 1)*(0.1 + Math.random()*0.26);
      laceX.beginPath(); laceX.ellipse(fX(gx*dd + gy*s), fY(gy*dd - gx*s), fs*(0.008 + Math.random()*0.03), fs*(0.005 + Math.random()*0.011), Math.atan2(-gx, gy) + (Math.random() - 0.5)*0.5, 0, TAU); laceX.fill();
    }
    laceX.globalAlpha = 1; L.laceAt = L.cT;
  }
  if (L.laceAt == null || L.cT < L.laceAt) L.laceAt = L.cT;
  laceClock += real;
  if (laceClock > 0.8){
    laceClock = 0; laceX.save(); laceX.globalCompositeOperation = 'destination-out';
    laceX.fillStyle = 'rgba(0,0,0,.05)'; laceX.fillRect(0, 0, FW, FH);
    if (beer > 2){                                            // beer washes it off again
      laceX.fillStyle = 'rgba(0,0,0,.5)'; laceX.beginPath();
      var c1 = L.cB + 0.03, tx = gy, ty = -gx;
      laceX.moveTo(fX(gx*c1 - tx*3), fY(gy*c1 - ty*3)); laceX.lineTo(fX(gx*c1 + tx*3), fY(gy*c1 + ty*3));
      laceX.lineTo(fX(gx*(c1 + 6) + tx*3), fY(gy*(c1 + 6) + ty*3)); laceX.lineTo(fX(gx*(c1 + 6) - tx*3), fY(gy*(c1 + 6) - ty*3)); laceX.closePath(); laceX.fill();
    }
    laceX.restore();
  }

  // condensation
  fogClock += real;
  if (fogClock > 0.09){ fogClock = 0; fogTick(0.017); }
  stepBeads(real);

  // read-outs, eased so the numbers never jump
  var total = beer + foam;
  mlSmooth += (total - mlSmooth)*ease(real, 14);
  var ml = Math.round(mlSmooth);
  if (ml !== shownMl){ shownMl = ml; elMl.textContent = ml; }
  var st = statusText(now, res.upright, total);
  if (st !== pendStatus){ pendStatus = st; pendAt = now; }
  if (pendStatus !== lastStatus && (now - pendAt > 260 || lastStatus === '')){ lastStatus = pendStatus; elStatus.textContent = pendStatus; }
  if (elTally.textContent !== String(count)) elTally.textContent = count;

  paint(now);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(data){
  if (data && typeof data.beer === 'number'){ beer = data.beer; foam = data.foam || 0; }
  peak = beer + foam; mlSmooth = peak;
  elTally.textContent = count;
  computeLevels();
  P.gxc = cx; P.cy = baseY - 1.78*u; P.zoom = 1;
  lastT = performance.now(); hintUntil = lastT + 14000;
  requestAnimationFrame(frame);
}
var hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(function(){ return { beer:beer, foam:foam }; }); } catch(e){}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
