<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kevin's fun things</title>
<style>
:root{--bg:#E4EEE3;--ink:#17352B;--muted:#4D685D;--card:#1C3A2F;--on-card:#F6EED8;--accent:#EFAA1A}
@media (prefers-color-scheme: dark){:root{--bg:#11281F;--ink:#F3EAD2;--muted:#9CB6A8;--card:#091812;--on-card:#F3EAD2;--accent:#F2B02A;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.5 "Arial Narrow","Helvetica Neue",Arial,sans-serif}
main{max-width:34rem;margin-inline:auto;padding:2.5rem 16px}
h1{font:400 2rem/1.1 Rockwell,"Roboto Slab",Georgia,serif;margin:0 0 .4rem}
p{margin:0 0 1.5rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
a{display:block;padding:1rem 1.1rem;border-radius:.8rem;background:var(--card);color:var(--on-card);text-decoration:none}
a strong{display:block;font:400 1.3rem/1.2 Rockwell,"Roboto Slab",Georgia,serif;color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Kevin's fun things</h1>
  <p>Small toys for the phone. Open them on mobile.</p>
  <ul>
    <li><a href="pocket-pint/"><strong>Pocket Pint</strong>Hold the tap to fill the glass, then tip your phone back to drink it.</a></li>
  </ul>
</main>
</body>
</html>
